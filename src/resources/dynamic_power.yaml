thresholds:
  low: 1
  high: 2
grace_period: 15
hardware:
  cpu_governor:
    path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
    options_path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
    modes:
      - performance
      - powersave
      - disabled
  epp_profile:
    path: /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference
    modes:
      - default
      - performance
      - balance_performance
      - balance_power
      - power
      - disabled
    options_path: /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_available_preferences
  acpi_platform_profile:
    path: /sys/firmware/acpi/platform_profile
    options_path: /sys/firmware/acpi/platform_profile_choices
    modes:
      - low-power
      - balanced
      - performance
      - disabled
  aspm:
    path: /sys/module/pcie_aspm/parameters/policy
    options_path: /sys/module/pcie_aspm/parameters/policy
    modes:
      - default
      - performance
      - powersave
      - powersupersave
      - disabled
profiles:
  # Every option ships disabled. Which values a machine accepts cannot be known in
  # advance - the valid EPP set depends on the running governor, the driver and the
  # platform - so the template declares no mapping at all rather than shipping one
  # that is wrong on most laptops.
  #
  # The editor reads the accepted values from the machine itself, through each
  # capability's options_path above. The hardware.*.modes lists are only a fallback for
  # when that cannot be read, and are no longer written back on save.
  powersave:
    cpu_governor: disabled
    epp_profile: disabled
    acpi_platform_profile: disabled
    aspm: disabled
  balanced:
    cpu_governor: disabled
    epp_profile: disabled
    acpi_platform_profile: disabled
    aspm: disabled
  performance:
    cpu_governor: disabled
    epp_profile: disabled
    acpi_platform_profile: disabled
    aspm: disabled
features:
  root:
    disclaimer:
      accepted: false
      accepted_at:
    nodes:
      - id: node:/proc/sys/kernel/nmi_watchdog
        path: /proc/sys/kernel/nmi_watchdog
        enabled: false
        ac_value: 1
        battery_value: 0
        policy_scope: override
      - id: node:/sys/module/snd_hda_intel/parameters/power_save
        path: /sys/module/snd_hda_intel/parameters/power_save
        enabled: false
        ac_value: 10
        battery_value: 1
        policy_scope: override
      - id: node:/proc/sys/vm/dirty_writeback_centisecs
        path: /proc/sys/vm/dirty_writeback_centisecs
        enabled: false
        ac_value: 1000
        battery_value: 6000
        policy_scope: override
      - id: node:/sys/devices/pci0000:00/0000:00:01.2/0000:02:00.0/power/control
        path: /sys/devices/pci0000:00/0000:00:01.2/0000:02:00.0/power/control
        enabled: false
        ac_value: on
        battery_value: auto
        policy_scope: override
      - id: node:/sys/devices/pci0000:00/0000:00:02.2/0000:07:00.0/power/control
        path: /sys/devices/pci0000:00/0000:00:02.2/0000:07:00.0/power/control
        enabled: false
        ac_value: on
        policy_scope: override
